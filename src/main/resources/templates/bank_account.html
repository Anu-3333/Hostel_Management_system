<!DOCTYPE html>
<html lang="en" xmlns="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Bank Account</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .navbar-custom {
            background-color: #2c3e50;
            z-index: 1000;
        }

        .navbar-custom .navbar-brand,
        .navbar-custom .navbar-nav .nav-link {
            color: #ecf0f1;
        }

        .navbar-custom .navbar-nav .nav-link:hover {
            color: #3498db;
        }

        .main-content {
            margin-top: 80px;
            padding: 20px;
        }

        .card {
            border-radius: 10px;
            transition: transform 0.3s, box-shadow 0.3s;
            background-color: #ffffff;
            border: none;
            color: #333;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
        }

        /* Form styling */
        label {
            font-weight: 600;
            margin-top: 10px;
            color: #555;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        button[type="submit"] {
            background-color: #2c3e50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 20px;
        }

        button[type="submit"]:hover {
            background-color: #34495e;
        }

        .message-box {
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message-box img {
            width: 24px;
            height: 24px;
            margin-right: 10px;
        }

        .footer {
            background-color: #2c3e50;
            color: #bdc3c7;
            padding: 20px 0;
            text-align: center;
        }

        .bank-account-table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .bank-account-table th,
        .bank-account-table td {
            padding: 15px;
            text-align: left;
            color: #333;
            border-bottom: 1px solid #eee;
        }

        .bank-account-table th {
            background-color: #2c3e50;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .bank-account-table tr:hover {
            background-color: #f8f9fa;
        }

        .btn-delete {
            background-color: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 5px;
            padding: 5px 10px;
        }

        .btn-delete:hover {
            background-color: #c0392b;
        }

        .no-requests {
            font-size: 1.5rem;
            font-weight: bold;
            color: #7f8c8d;
            text-align: center;
            margin-top: 20px;
        }

        .no-requests i {
            font-size: 3rem;
            color: #bdc3c7;
            margin-bottom: 20px;
            display: block;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top">
        <a class="navbar-brand" href="#">Hostel Management System</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <div class="container">
            <div th:if="${error}" class="message-box error">
                <img src="https://cdn-icons-png.flaticon.com/512/680/680542.png" alt="Error Icon">
                <span>Card Already Exists!</span>
            </div>
            <div th:if="${success}" class="message-box success">
                <img src="https://cdn-icons-png.flaticon.com/512/190/190411.png" alt="Success Icon">
                <span>Card Added Successfully!</span>
            </div>
            <div class="container-inner animate__animated animate__fadeIn">
                <h1 class="mb-4 text-center text-dark">Add Bank Account</h1>
                <div class="card p-4 mb-4">
                    <form action="#" th:action="@{/addbankaccount}" th:object="${bankAccount}" method="post">
                        <label>Account Number:</label>
                        <input type="text" th:field="*{cardNumber}" required pattern="\d{12}"
                            title="Enter a valid 12-digit account number" placeholder="Enter 12-digit Account Number" />
                        <br />

                        <label>Card Holder Name:</label>
                        <input type="text" th:field="*{cardHolderName}" required />
                        <br />

                        <label>Email ID:</label>
                        <input type="email" th:field="*{email}" required placeholder="Enter Email ID" />
                        <br />

                        <!-- Expiry Date removed as per request -->

                        <label>CVV:</label>
                        <input type="text" th:field="*{cvv}" required pattern="\d{3,4}"
                            title="Enter a valid 3 or 4 digit CVV" />
                        <br />

                        <label>PIN:</label>
                        <input type="password" th:field="*{pin}" required />
                        <br />

                        <button type="submit">Add Bank Account</button>
                    </form>


                </div>

                <h2 class="text-center mb-4">Bank Account</h2>

                <div th:if="${#lists.isEmpty(bankAccounts)}">
                    <div class="no-requests">
                        <i class="fas fa-wallet"></i>
                        No Bank Accounts Found
                    </div>
                </div>
                <div th:unless="${#lists.isEmpty(bankAccounts)}">
                    <table class="table bank-account-table animate__animated animate__fadeIn">
                        <thead>
                            <tr>
                                <th scope="col">Account Number</th>
                                <th scope="col">Account Holder Name</th>
                                <th scope="col">Email</th>
                                <th scope="col">CVV</th>
                                <th scope="col">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="bankAccount : ${bankAccounts}">
                                <td th:text="${bankAccount.cardNumber}">123456789012</td>
                                <td th:text="${bankAccount.cardHolderName}">John Doe</td>
                                <td th:text="${bankAccount.email}">john@example.com</td>
                                <td th:text="${bankAccount.cvv}">123</td>
                                <td>
                                    <form th:action="@{/deletebankaccount/{id}(id=${bankAccount.id})}" method="post">
                                        <button type="submit" class="btn-delete"><i
                                                class="fas fa-trash-alt"></i></button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <!-- Social icons and email removed -->
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
</body>

</html>
