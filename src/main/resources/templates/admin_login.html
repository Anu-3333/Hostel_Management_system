<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Admin Login - Hostel Management System</title>
    <!-- Favicon Icon -->
    <link rel="icon" href="https://www.flaticon.com/svg/static/icons/svg/888/888879.svg" type="image/svg+xml">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <!-- Custom CSS -->
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            /* Dark Slate Blue */
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            padding-top: 20px;
            flex-shrink: 0;
            height: 100vh;
        }

        .sidebar-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #34495e;
            margin-bottom: 20px;
        }

        .sidebar-header h3 {
            font-size: 1.2rem;
            margin: 0;
            font-weight: 600;
            color: #3498db;
            /* Accent color */
        }

        .nav-links {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-links li {
            width: 100%;
        }

        .nav-links a {
            display: block;
            padding: 15px 20px;
            color: #bdc3c7;
            text-decoration: none;
            transition: all 0.3s;
            border-left: 4px solid transparent;
        }

        .nav-links a:hover {
            background-color: #34495e;
            color: #ecf0f1;
            border-left-color: #3498db;
        }

        .nav-links a.active {
            background-color: #34495e;
            color: #ecf0f1;
            border-left-color: #3498db;
        }

        .nav-links i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }

        /* Main Content Styles */
        .main-content {
            flex-grow: 1;
            background-color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-header {
            margin-bottom: 40px;
        }

        .login-header h2 {
            font-weight: 300;
            color: #2c3e50;
            font-size: 2.5rem;
        }

        .form-group label {
            font-weight: 600;
            color: #7f8c8d;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            border-radius: 2px;
            border: 1px solid #bdc3c7;
            padding: 10px 15px;
            height: auto;
            background-color: #fdfdfd;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #3498db;
        }

        .btn-primary {
            background-color: #2c3e50;
            border-color: #2c3e50;
            padding: 10px;
            font-weight: 600;
            border-radius: 2px;
            transition: background 0.3s;
        }

        .btn-primary:hover {
            background-color: #34495e;
            border-color: #34495e;
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
        }

        .footer-link a {
            color: #e74c3c;
        }

        .section-label {
            padding: 10px 20px;
            font-size: 0.8rem;
            color: #7f8c8d;
            text-transform: uppercase;
            font-weight: bold;
            margin-top: 10px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                padding: 10px;
            }

            .nav-links a {
                padding: 10px;
            }

            .sidebar-header {
                padding: 10px;
                border: none;
                margin-bottom: 0;
            }
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="sidebar-header">
            <h3>Hostel Management System</h3>
        </div>

        <div class="section-label">MAIN</div>
        <ul class="nav-links">
            <li>
                <a href="/register"><i class="fas fa-user-plus"></i> Student Registration</a>
            </li>
            <li>
                <a href="/admin-register"><i class="fas fa-user-shield"></i> Admin Registration</a>
            </li>
            <li>
                <a href="/login"><i class="fas fa-users"></i> Student Login</a>
            </li>
            <li>
                <a href="/admin-login" class="active"><i class="fas fa-user-lock"></i> Admin Login</a>
            </li>
            <li>
                <a href="/"><i class="fas fa-home"></i> Home</a>
            </li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="login-container">
            <div class="login-header">
                <h2>Admin Login</h2>
            </div>

            <div th:if="${success}" class="alert alert-success">
                <p th:text="${success}"></p>
            </div>

            <!-- Error parameter handling -->
            <div th:if="${param.error}" class="alert alert-danger">
                Invalid email or password, or wrong login portal.
            </div>
            <div th:if="${param.logout}" class="alert alert-success">
                You have been logged out.
            </div>
            <div th:if="${error}" class="alert alert-danger">
                <span th:text="${error}"></span>
            </div>

            <form method="post" th:action="@{/login-user}" id="loginForm">
                <!-- IMPORTANT: Flag to identify Admin login -->
                <input type="hidden" name="loginType" value="admin">

                <div class="form-group">
                    <label for="username">EMAIL</label>
                    <input type="email" class="form-control" id="username" name="username" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <label for="password">PASSWORD</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Password"
                        required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Login</button>

                <div class="footer-link">
                    <a href="#" data-toggle="modal" data-target="#forgotPasswordModal">Forgot password?</a>
                </div>
            </form>
        </div>
    </main>

    <!-- Forgot Password Modal -->
    <div class="modal fade" id="forgotPasswordModal" tabindex="-1" role="dialog"
        aria-labelledby="forgotPasswordModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="forgotPasswordModalLabel">Forgot Password</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <p>Enter your email address to reset your password.</p>
                    <form method="post" th:action="@{/forgot-password}">
                        <div class="form-group">
                            <label for="forgotEmail">Email address</label>
                            <input type="email" class="form-control" id="forgotEmail" name="email"
                                placeholder="Enter your email" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>
